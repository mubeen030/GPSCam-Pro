name: gps_camera
description: A GPS Camera application.
# Added Developer Name for documentation
author: "Mubeen" 
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Camera & Location
  camera: ^0.10.5
  geolocator: ^10.1.0
  geocoding: ^2.1.1
  
  # Maps
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  
  # Utilities
  image_picker: ^1.0.4
  permission_handler: ^11.0.1
  gal: ^2.2.1
  intl: ^0.18.1
  screenshot: ^3.0.0
  path_provider: ^2.1.1
  path: ^1.8.3
  share_plus: ^9.0.0
  
  # Splash Screen (Runtime dependency)
  flutter_native_splash: ^2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  # APP ICON GENERATOR
  flutter_launcher_icons: ^0.13.1

# --- Flutter Config ---
flutter:
  uses-material-design: true
  assets:
    - assets/image_0.png
    - assets/image_0.png

# --- Splash Screen Config ---
# --- Splash Screen Config ---
# ... inside pubspec.yaml ...

flutter_native_splash:
  color: "#000000"
  image: assets/image_0.png
  fullscreen: true
  # This line tells it to use the text image you just created
  branding: assets/developer_text.png 
  android_12:
    image: assets/image_0.png
    color: "#000000"
    branding: assets/developer_text.png

# --- App Icon Config (UPDATED) ---
flutter_icons:
  android: "launcher_icon"
  ios: true
  # Using image_1.png for the App Icon
  image_path: "assets/image_0.png"
  min_sdk_android: 21